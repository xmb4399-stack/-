# 把这个项目推到 GitHub 之后，它会自动在云端 Linux 机器上编译出 APK。
#
# 用法：
#   1. 推到 GitHub（main 或 master 分支）
#   2. 打开仓库的 Actions 页面，等 "编译安卓 APK" 跑完（第一次约 40-60 分钟）
#   3. 在跑完的记录页面最下方，下载 Artifacts 里的 elder-player-apk
#   4. 解压得到 .apk，传到手机上安装
#
# 想换目标架构的话：Actions 页面点 "Run workflow"，选 archs 再跑。

name: 编译安卓 APK

on:
  push:
    branches: [main, master]
    # 只有下面这些内容变了才编译。
    # 好处：改 README、改这份脚本、让机器人回写报错文件，都不会白白触发
    # 一次几十分钟的编译。要强制编译就手动点 Run workflow。
    paths:
      - 'buildozer.spec'
      - 'ci-constraints.txt'
      - '**.py'
      - 'assets/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      archs:
        description: '目标 CPU 架构'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
          - 'arm64-v8a,armeabi-v7a'
          - 'armeabi-v7a'

permissions:
  contents: write
  actions: read

# 同一个分支同时只跑一个编译。
# 为什么要加：一次推多个文件会产生多个 commit，每个 commit 都触发一次编译，
# 而两次编译的 actions/cache key 是一样的（key 里只有 buildozer.spec 的哈希），
# 同时跑会互相踩缓存 —— 实测有一半概率在「开始编译」那一步挂掉。
# 加了这个之后，后一次会自动取消前一次，只留最后一次的结果。
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 必须用 22.04：24.04 已经没有 libtinfo5，安卓 SDK 里的工具会缺依赖
    runs-on: ubuntu-22.04

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache gettext \
            libltdl-dev

      - name: 安装 buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Cython 必须锁在 0.29 线，3.x 会把 python-for-android 编崩
          pip install "cython==0.29.36" buildozer

      - name: 显示环境信息
        run: |
          python --version
          java -version
          buildozer --version
          echo "--- pip 约束文件 ---"
          cat ci-constraints.txt || echo "没有约束文件"

      # 缓存是可选的加速手段。命中就快很多，没命中或者失败都不影响编译。
      - name: 恢复编译缓存
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_number }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-
            buildozer-${{ runner.os }}-

      - name: 覆盖目标架构（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i "s/^android.archs = .*/android.archs = ${{ github.event.inputs.archs }}/" buildozer.spec
          grep '^android.archs' buildozer.spec

      # libVLC 一个 AAR 里带了 4 种架构的解码库，每种压缩后都有 19MB 左右。
      # 这一步按上面定好的 android.archs，把用不上的架构从打包列表里剔出去，
      # 否则 APK 会因为塞进 x86 模拟器用的解码库而白白胖几十 MB。
      - name: 按目标架构裁剪 libVLC 解码库
        run: python tools/trim_libvlc_abis.py

      - name: 开始编译
        # PIP_CONSTRAINT 让 python-for-android 内部的每一次 pip 都读这个约束文件。
        # 没有它，kivy 依赖链里的 charset-normalizer 会让编译在
        # "is not a supported wheel on this platform" 处失败（详见 ci-constraints.txt）。
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/ci-constraints.txt
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          # 输出写进文件，失败时下面的步骤能把它摘出来写回仓库
          yes | buildozer -v android debug > /tmp/buildozer.log 2>&1
          status=$?
          echo "buildozer 退出码=$status"
          tail -40 /tmp/buildozer.log
          exit $status

      # 失败时把报错写回仓库，方便事后（不用登录、不用下载日志）直接查原因
      - name: 失败时记录报错
        if: failure()
        run: |
          set +e
          {
            echo "# 编译失败摘要"
            echo
            echo "时间：$(date -u '+%Y-%m-%d %H:%M UTC')   提交：${{ github.sha }}"
            echo
            echo "## buildozer 输出的最后 200 行"
            echo '```'
            tail -200 /tmp/buildozer.log
            echo '```'
            echo
            echo "## 含报错字样的行"
            echo '```'
            grep -nEi "error|failed|exception|traceback|no such file|cannot find|not found" /tmp/buildozer.log | tail -150
            echo '```'
          } > ci-last-error.md
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci-last-error.md
          git commit -m "CI：记录编译失败原因 [skip ci]" || echo "没有变化"
          git push || echo "没有要推的内容"

      - name: 列出产物
        if: always()
        run: |
          ls -lh bin/ || true
          echo
          echo "=== APK 里各架构的 .so 体积（确认裁剪有没有生效）==="
          for apk in bin/*.apk; do
            [ -e "$apk" ] || continue
            echo "--- $apk ---"
            unzip -l "$apk" | awk '/lib\// {n=$4; s=$1; sub(/\/[^\/]*$/, "", n); a[n]+=s} END {for (k in a) printf "  %-18s %8.1f MB\n", k, a[k]/1048576}'
          done
          echo
          echo "（上面应该只有 android.archs 里指定的那几个架构；"
          echo "  如果出现了 x86 / x86_64，说明 packagingOptions 的裁剪没生效）"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: elder-player-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 90
